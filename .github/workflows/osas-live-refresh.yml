name: OSAS LIVE playlist refresh

on:
  workflow_dispatch:
  schedule:
    - cron: "17 5 * * 0"
  push:
    paths:
      - ".github/workflows/osas-live-refresh.yml"
      - "osas-live/build_playlist.py"
      - "osas-live/favorites.m3u"

permissions:
  contents: write

concurrency:
  group: osas-live-update
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Refresh public English TV and internet radio
        run: python osas-live/build_playlist.py
      - name: Commit new playlist if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add osas-live/playlist.m3u osas-live/status.json
          if ! git diff --cached --quiet; then
            git commit -m "Refresh OSAS LIVE TV and radio playlist"
            git push
          else
            echo "Playlist unchanged"
          fi
